name: pages
on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify public HTML, manuscript, and reference files
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "${SITE_URL%/}" = 'https://sokldjs554.github.io/npuloop'
          mkdir -p "$RUNNER_TEMP/npuloop-public-check"
          REPORT="$RUNNER_TEMP/npuloop-public-check/checks.tsv"
          printf 'path\tsha256\tstatus\n' > "$REPORT"
          for rel in index.html research/npuloop_thesis.pdf reference/USAGE.md reference/VALIDATION_SCOPE.md reference/EXPERIMENTS.md reference/e9_customer_intake.json; do
            expected="docs/$rel"
            test -f "$expected"
            target="$RUNNER_TEMP/npuloop-public-check/$(basename "$rel")"
            matched=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
                "${SITE_URL%/}/$rel?publication=$GITHUB_SHA" -o "$target" && cmp -s "$expected" "$target"; then
                matched=true
                break
              fi
              sleep 10
            done
            if [ "$matched" != true ]; then
              echo "::error::Public file is unavailable or differs from this commit: $rel"
              exit 1
            fi
            digest=$(sha256sum "$target" | cut -d' ' -f1)
            printf '%s\t%s\tpassed\n' "$rel" "$digest" | tee -a "$REPORT"
          done
          echo "Verified public assets for commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
      - name: Save public-site verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-verification
          path: ${{ runner.temp }}/npuloop-public-check/checks.tsv
          if-no-files-found: warn
          retention-days: 14
