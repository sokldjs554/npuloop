name: import-approved-workbench
on:
  push:
    branches: [release/workbench-20260916]
    paths: ['.publish/ready.json']
permissions:
  contents: write
concurrency:
  group: import-approved-workbench
  cancel-in-progress: false
jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify and apply the approved source bundle
        run: python .publish/import.py
      - name: Install build and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy matplotlib pytest pytest-timeout playwright pypdf
          sudo apt-get update
          sudo apt-get install -y texlive-luatex texlive-lang-korean texlive-latex-extra texlive-fonts-recommended fonts-texgyre fonts-nanum fonts-liberation
          python -m playwright install --with-deps chromium
      - name: Build the reviewed manuscript and complete demo
        run: |
          mkdir -p verification/publish
          make paper-reviewed > verification/publish/paper-build.log 2>&1
          make demo-structure > verification/publish/demo-build.log 2>&1
          if grep -E 'undefined references|undefined citations|Overfull \\hbox|Missing character:' paper/npuloop_thesis.log; then
            echo 'Manuscript build warnings require review.'
            exit 1
          fi
          python .publish/check_outputs.py
      - name: Run the complete test suite and real checkpoint example
        run: |
          python -m pytest -q -rs --timeout=180 --timeout-method=thread | tee verification/publish/tests.log
          ONEDNN_MAX_CPU_ISA=AVX2 python -m pytest -q -rs --timeout=180 --timeout-method=thread | tee verification/publish/tests-avx2.log
          make quickstart > verification/publish/quickstart.log 2>&1
          python tools/submission_quality.py --regenerate --report verification/publish/paper-quality.json
      - name: Verify the browser and create the repository preview
        run: |
          BROWSER=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python tools/check_workbench_browser.py --browser "$BROWSER" --output verification/publish/browser
          python .publish/capture_preview.py --browser "$BROWSER"
      - name: Commit validated source and generated assets to the staging branch only
        run: |
          python .publish/check_outputs.py
          git diff --exit-code -- results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md START_HERE.md Makefile .gitignore pyproject.toml demo docs npuloop paper tests tools submission_checks verification/publish verification/workbench
          git diff --cached --check -- . ':!verification/**'
          git commit -m 'Integrate and verify the user-approved npuloop workbench'
          git push origin HEAD:release/workbench-20260916
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-publication-validation
          path: verification/publish/
          retention-days: 14
